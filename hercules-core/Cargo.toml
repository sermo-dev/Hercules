[package]
name = "hercules-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib"]
name = "hercules_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
bitcoin = { version = "0.32", features = ["serde"] }
# Script verification backends (ticket 047). See src/script_verify/mod.rs.
hercules-kernel-sys = { path = "kernel-sys", optional = true }
bitcoinconsensus = { version = "0.106", optional = true }
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
flate2 = "1.0"
rusqlite = { version = "0.36", features = ["bundled"] }
heed = "0.20"
libc = "0.2"
log = "0.4"
thiserror = "1.0"
arti-client = { version = "0.41", default-features = false, features = [
    "tokio", "rustls", "onion-service-client", "onion-service-service", "compression"
] }
tor-rtcompat = { version = "0.41", features = ["tokio"] }
tor-cell = "0.41"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util"] }
tokio-stream = "0.1"
safelog = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blvm-muhash = "0.1"

[features]
default = ["script-kernel"]
# libbitcoinkernel from a pinned Bitcoin Core release (kernel-sys/build.rs).
script-kernel = ["dep:hercules-kernel-sys"]
# The frozen, patched libbitcoinconsensus v26 (patches/bitcoinconsensus).
# Use instead of the kernel: `--no-default-features --features
# script-consensus-legacy`. Enabling both backends alone is a compile error.
script-consensus-legacy = ["dep:bitcoinconsensus"]
# Test-only: every script check runs through both backends and the process
# aborts if they disagree. Compile error in release (non-test) builds.
script-differential = ["script-kernel", "script-consensus-legacy"]

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
# Property-based tests (round-trips, invariants, parsers never panic).
proptest = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "convert_snapshot"
path = "src/bin/convert_snapshot.rs"

[patch.crates-io]
bitcoinconsensus = { path = "patches/bitcoinconsensus" }
