name: HerculesApp

# Source of truth for HerculesApp.xcodeproj. After editing, run
# `xcodegen generate` from this directory and commit the regenerated
# project.pbxproj together with the generated Info.plist / .entitlements
# files. Never hand-edit project.pbxproj.
#
# Every identifier (bundle IDs, App Group, BGTask IDs, background URLSession
# ID, display name, versions) lives in Config/Shared.xcconfig. Nothing below
# should hardcode one — reference the build setting instead.

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

targets:
  HerculesApp:
    type: application
    platform: iOS
    sources:
      - path: HerculesApp
      - path: ../build/hercules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        OTHER_LDFLAGS: ["-lc++"]
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone only (ticket 051): the product is a node on your phone.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HerculesApp/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(BGTASK_CATCHUP_ID)
          - $(BGTASK_PROCESSING_ID)
        NSSupportsLiveActivities: true
        # Runtime identifiers read by AppIdentifiers.swift.
        HRCAppGroupID: $(APP_GROUP_ID)
        HRCCatchUpTaskID: $(BGTASK_CATCHUP_ID)
        HRCProcessingTaskID: $(BGTASK_PROCESSING_ID)
        HRCSnapshotSessionID: $(SNAPSHOT_SESSION_ID)
    entitlements:
      path: HerculesApp/HerculesApp.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Ticket 030: lifts iOS's per-process virtual-address cap so the
        # UTXO LMDB env can mmap its 32+ GiB map. Requires the "Extended
        # Virtual Address Space" capability on the App ID in the developer
        # portal before signed builds will provision.
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - framework: ../build/herculesFFI.xcframework
        embed: false
      - target: HerculesWidget

  # Ticket 054: unit tests for the app's Swift logic. A logic bundle (no
  # host app, no FFI): it compiles the app sources it tests, which are
  # kept free of UIKit and the Rust bindings for that reason. Runs on the
  # simulator in CI (`xcodebuild test -scheme HerculesAppTests`).
  HerculesAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HerculesAppTests
      - path: HerculesApp/AppIdentifiers.swift
      - path: HerculesApp/NetworkPolicy.swift
      - path: HerculesApp/NotificationHistory.swift
      - path: HerculesApp/RelayRegistration.swift
      - path: HerculesApp/SnapshotDownloader.swift
      - path: HerculesApp/StoragePaths.swift
      - path: HerculesApp/WakeCoordination.swift
      - path: HerculesApp/WakeGate.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"

  HerculesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HerculesWidget
      # Shared with the app target (widget state + Live Activity attributes).
      - path: HerculesApp/AppIdentifiers.swift
      - path: HerculesApp/SharedNodeState.swift
      - path: HerculesApp/NodeActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HerculesWidget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Runtime identifiers read by AppIdentifiers.swift.
        HRCAppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: HerculesWidget/HerculesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

schemes:
  HerculesAppTests:
    build:
      targets:
        HerculesAppTests: [test]
    test:
      targets:
        - HerculesAppTests
